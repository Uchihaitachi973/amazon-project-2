<!DOCTYPE html>
<html>

<head>
    <title>Amazon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="amazon.css">
</head>

<body>
    <header class = "header">
        <div class = "left-section">
            <div class = "logo-block">
                <img class = "logo" src="images/logo 4.png" alt="Amazon">
            </div>
            <div class = "location">
                <span class = "address">Delivering to Ludhiana 141001</span>
                <span class = "update-address">Update Location</span>
            </div>
        </div>

        <div class = "middle-section">
            <div class = "side-search">
                <p class = "side-search-text">All</p>
                <span class = "all-scroll">&#9662;</span>
            </div>
            <input class = "search-box" type="text" placeholder="Search Amazon.in">
            <button class = "search-button"><img src="images/search.png"></button>
        </div>

        <div class = "right-bar">
            <div class = "language-block">
                <img class = "india-flag" src="images/india.png">
                <p class = "language">EN</p>
                <span>&#9662;</span>
            </div>

            <div class = "account-info">
                <span class = "greeting">Hello, sign in</span>
                <span class = "account">Account & Lists</span>
                <span class = "account-scroll">&#9662;</span>
            </div>

            <div class = "status-info">
                <span class = "return">Returns</span>
                <span class = "orders">& Orders</span>
            </div>

            <div class = "cart-block">
                <img class = "cart" src="images/cart logo.png" alt="Cart">
            </div>
        </div>

    </header>

    <header class = "second-header">
        <div class = "menu">   
            <img class = "hamburger-menu" src="images/hamburger-menu.png" alt="All">
            <p class = "all-menu">All</p>
        </div>

        <div>
            Fresh
        </div>

        <div>
            Prime video
        </div>

        <div>
            Sell
        </div>

        <div>
            Bestsellers
        </div>

        <div>
            Today's Deals
        </div>

        <div>
            Mobiles
        </div>

        <div>
            New Releases
        </div>

        <div>
            Prime
        </div>

        <div>
            Amazon Pay
        </div>

        <div>
            Electronics
        </div>

        <div>
            Customer Service
        </div>

        <div>
            Home & Kitchen
        </div>

        <div>
            Fashion
        </div>

        <div class = "computer-menu">
            Computers
        </div>
    </header>

    <section class = "hero-banner">
        <img src = "images/banner image.png">
        <div class = "fade"></div>
        <div class = "left-arrow"></div>
        <div class = "right-arrow"></div>
    </section>
    <section>
        <div class = "card-grid">
            <div class = "card-1">hi</div>
            <div class = "card-2">hi</div>
            <div class = "card-3">hi</div>
            <div class = "card-4">hi</div>
            <div class = "card-5">hi</div>
            <div class = "card-6">hi</div>
            <div class = "card-7">hi</div>
            <div class = "card-8">hi</div>
        </div>

    </section>

</body>

</html>
